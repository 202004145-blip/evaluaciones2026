<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC · Evaluado</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="../data/preguntas.js"></script>
    <script src="../data/escalas.js"></script>
    <script src="../src/storage.js"></script>
    <script src="evaluado.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>📊 DISC · Perfil de Personalidad</h1>
        <p>Selecciona <strong>1 MÁS</strong> y <strong>1 MENOS</strong> por grupo.</p>
        <hr>

        <div id="inicio">
            <div style="margin:16px 0;">
                <label><strong>Nombre:</strong></label>
                <input type="text" id="nombre" placeholder="Nombre completo">
            </div>
            <div style="margin:16px 0;">
                <label><strong>Cargo (opcional):</strong></label>
                <input type="text" id="cargo" placeholder="Ej. Ejecutivo comercial">
            </div>
            <button class="btn" id="btnIniciar">Comenzar test →</button>
            <div style="margin-top:16px;"><a href="/" style="color:#64748b;">← Volver al menú</a></div>
        </div>

        <div id="test" class="oculto">
            <div class="progreso">Progreso: <span id="progreso">0</span>/28</div>
            <div id="preguntas"></div>
            <button class="btn" id="btnEnviar">Finalizar y enviar</button>
            <div class="warn" id="warn">Faltan preguntas por responder.</div>
        </div>

        <div id="gracias" class="oculto">
            <div class="gracias">
                <div class="icono">✅</div>
                <h2>Cuestionario finalizado</h2>
                <p>Gracias por completar el DISC.</p>
                <p style="font-size:14px; color:#64748b; margin-top:8px;">El equipo de selección revisará tus resultados.</p>
                <a href="/" style="color:#0f172a;">← Volver al menú</a>
            </div>
        </div>
    </div>
</body>
</html>
