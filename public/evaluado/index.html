<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISC · Panel del Evaluador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 28px; }
        .login { max-width: 400px; margin: 40px auto; }
        .login input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; margin: 6px 0; }
        .btn { background: #0f172a; color: white; padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #1e293b; }
        .btn.secundario { background: #e2e8f0; color: #0f172a; }
        .btn.secundario:hover { background: #cbd5e1; }
        table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        th { background: #f1f5f9; text-align: left; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .sesion { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
        .sesion h3 { margin-bottom: 8px; }
        .puntuaciones { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
        .puntuaciones span { background: #f1f5f9; padding: 4px 16px; border-radius: 4px; font-size: 15px; }
        .oculto { display: none; }
        .error { color: #dc2626; margin-top: 8px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .tabla-respuestas { font-size: 14px; }
        .tabla-respuestas td { padding: 6px 10px; }
        .mas { color: #16a34a; font-weight: 600; }
        .menos { color: #dc2626; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 DISC · Panel del Evaluador</h1>
        <hr>

        <!-- LOGIN -->
        <div id="login">
            <div class="login">
                <h2>Iniciar sesión</h2>
                <input type="text" id="loginUser" placeholder="Usuario">
                <input type="password" id="loginPass" placeholder="Contraseña">
                <button class="btn" id="btnLogin">Entrar</button>
                <div class="error" id="loginError"></div>
            </div>
        </div>

        <!-- PANEL -->
        <div id="panel" class="oculto">
            <div class="header">
                <span id="usuarioActual" style="font-weight:600;"></span>
                <button class="btn secundario" id="btnLogout">Cerrar sesión</button>
            </div>
            <div id="resultados"></div>
        </div>
    </div>

    <script>
        // ===== CONSTANTES =====
        const API_URL = '/api/auth/login';
        const API_SESIONES = '/api/disc/sesiones';

        // ===== LOGIN =====
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const usuario = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!usuario || !password) {
                errorEl.textContent = 'Completa usuario y contraseña.';
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error de login');
                document.getElementById('login').classList.add('oculto');
                document.getElementById('panel').classList.remove('oculto');
                document.getElementById('usuarioActual').textContent = '👤 ' + usuario;
                cargarResultados();
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            document.getElementById('login').classList.remove('oculto');
            document.getElementById('panel').classList.add('oculto');
            document.getElementById('loginPass').value = '';
        });

        // ===== CARGAR RESULTADOS =====
        async function cargarResultados() {
            try {
                const res = await fetch(API_SESIONES);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al cargar');
                mostrarResultados(data);
            } catch (err) {
                document.getElementById('resultados').innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
            }
        }

        // ===== MOSTRAR RESULTADOS =====
        function mostrarResultados(sesiones) {
            const div = document.getElementById('resultados');
            if (!sesiones || sesiones.length === 0) {
                div.innerHTML = '<p>No hay sesiones registradas aún.</p>';
                return;
            }

            // Escalas para corrección
            const ESCALAS = {
                D: ["entusiasta", "rápido/a", "atrevido/a", "dominante", "decisivo/a", "valeroso/a", "osado/a", "competitivo/a", "audaz", "resuelto/a", "agresivo/a", "enérgico/a", "pionero"],
                I: ["elocuente", "comunicativo/a", "encantador/a", "alegre", "estimulante", "popular", "sociable", "vivaz", "animado/a", "cautivador/a", "desenvuelto/a", "espontáneo/a"],
                S: ["apacible", "bondadoso/a", "tranquilo/a", "tolerante", "moderado/a", "sensible", "constante", "pacífico", "gentil", "considerado/a", "calmado/a", "paciente", "amistoso/a", "comprensivo/a", "generoso/a"],
                C: ["lógico/a", "cauteloso/a", "preciso/a", "controlado/a", "concienzudo/a", "cuidadoso/a", "precavido/a", "discreto/a", "perfeccionista", "atento/a", "perceptivo/a", "reflexivo/a", "analítico/a", "meticuloso/a", "sistemático/a", "metódico/a"]
            };

            const PALABRAS = [
                ["entusiasta", "rápido/a", "lógico/a", "apacible"],
                ["cauteloso/a", "decidido/a", "receptivo/a", "bondadoso/a"],
                ["amigable", "preciso/a", "franco/a", "tranquilo/a"],
                ["elocuente", "controlado/a", "tolerante", "decisivo/a"],
                ["atrevido/a", "concienzudo/a", "comunicativo/a", "moderado/a"],
                ["ameno/a", "ingenioso/a", "investigador/a", "acepta riesgos"],
                ["expresivo/a", "cuidadoso/a", "dominante", "sensible"],
                ["extrovertido/a", "precavido/a", "constante", "impaciente"],
                ["discreto/a", "complaciente", "encantador/a", "insistente"],
                ["valeroso/a", "anima a los demás", "pacífico", "perfeccionista"],
                ["reservado/a", "atento/a", "osado/a", "alegre"],
                ["estimulante", "gentil", "perceptivo/a", "independiente"],
                ["competitivo/a", "considerado/a", "alegre", "sagaz"],
                ["meticuloso/a", "obediente", "ideas firmes", "alentador/a"],
                ["popular", "reflexivo/a", "tenaz", "calmado/a"],
                ["analítico/a", "audaz", "leal", "promotor/a"],
                ["sociable", "paciente", "auto suficiente", "certero/a"],
                ["adaptable", "resuelto/a", "prevenido/a", "vivaz"],
                ["agresivo/a", "impetuoso/a", "amistoso/a", "discerniente"],
                ["de trato fácil", "comprensivo/a", "cauto/a", "habla directo"],
                ["evaluador/a", "generoso/a", "animado/a", "persistente"],
                ["impulsivo/a", "cuida los detalles", "enérgico/a", "tranquilo/a"],
                ["sociable", "sistemático/a", "vigoroso/a", "tolerante"],
                ["cautivador/a", "contento/a", "exigente", "apegado/a a las normas"],
                ["le agrada discutir", "metódico/a", "comedido/a", "desenvuelto/a"],
                ["jovial", "preciso/a", "directo/a", "ecuánime"],
                ["inquieto/a", "amable", "elocuente", "cuidadoso/a"],
                ["prudente", "pionero", "espontáneo/a", "colaborador"]
            ];

            let html = '';
            sesiones.forEach((sesion, idx) => {
                const respuestas = sesion.respuestas || {};
                const puntuaciones = { D: 0, I: 0, S: 0, C: 0 };

                // Calcular puntuaciones
                Object.keys(respuestas).forEach(key => {
                    const r = respuestas[key];
                    if (r.mas) {
                        Object.keys(ESCALAS).forEach(escala => {
                            if (ESCALAS[escala].includes(r.mas)) puntuaciones[escala] += 1;
                        });
                    }
                    if (r.menos) {
                        Object.keys(ESCALAS).forEach(escala => {
                            if (ESCALAS[escala].includes(r.menos)) puntuaciones[escala] -= 1;
                        });
                    }
                });

                html += `
                    <div class="sesion">
                        <h3>${idx+1}. ${sesion.nombre || 'Anónimo'}</h3>
                        <p><strong>Cargo:</strong> ${sesion.cargo || 'No especificado'}</p>
                        <p><strong>Fecha:</strong> ${sesion.fecha || '—'}</p>

                        <div class="puntuaciones">
                            ${Object.entries(puntuaciones).map(([escala, valor]) =>
                                `<span><strong>${escala}:</strong> ${valor}</span>`
                            ).join('')}
                        </div>

                        <details>
                            <summary style="cursor:pointer;font-weight:600;margin:12px 0;">📋 Ver respuestas en bruto</summary>
                            <table class="tabla-respuestas">
                                <tr><th>#</th><th>MÁS</th><th>MENOS</th><th>Palabras</th></tr>
                                ${Object.keys(respuestas).sort((a,b) => parseInt(a)-parseInt(b)).map(key => {
                                    const r = respuestas[key];
                                    const idxP = parseInt(key);
                                    const grupo = PALABRAS[idxP] || [];
                                    return `<tr>
                                        <td>${idxP+1}</td>
                                        <td class="mas">${r.mas || '-'}</td>
                                        <td class="menos">${r.menos || '-'}</td>
                                        <td>${grupo.join(', ')}</td>
                                    </tr>`;
                                }).join('')}
                            </table>
                        </details>
                    </div>
                `;
            });
            div.innerHTML = html;
        }

        // ===== AUTO-LOGIN SI YA ESTÁ AUTENTICADO =====
        async function verificarSesion() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (res.ok && data.evaluador) {
                    document.getElementById('login').classList.add('oculto');
                    document.getElementById('panel').classList.remove('oculto');
                    document.getElementById('usuarioActual').textContent = '👤 ' + data.evaluador.usuario;
                    cargarResultados();
                }
            } catch (e) {}
        }
        verificarSesion();

        // ===== ENTER PARA LOGIN =====
        document.getElementById('loginPass').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btnLogin').click();
        });
    </script>
</body>
</html>
